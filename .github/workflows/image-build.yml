name: Image Build

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing release tag to upload the base image assets to (leave empty to only keep a workflow artifact)"
        required: false
        default: ""
  push:
    branches:
      - phase1-base-image
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  base-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync parted fdisk e2fsprogs xz-utils unzip qemu-user-static binfmt-support systemd

      - name: Register arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download and verify pinned Raspberry Pi OS Lite base
        run: |
          URL="$(jq -r .downloadUrl config/base-image.json)"
          SHA="$(jq -r .sha256 config/base-image.json)"
          curl -fL --retry 3 -o base.img.xz "$URL"
          echo "$SHA  base.img.xz" | sha256sum -c -

      - name: Build base image
        run: |
          VERSION="$(tr -d '[:space:]' < docs/VERSION)"
          sudo true
          sudo -v
          bash scripts/build-appliance-image.sh \
            --base-image base.img.xz \
            --base-mode \
            --output "artifacts/base/ewp-base-${VERSION}.img"

      - name: Verify base image contents
        run: |
          IMG="artifacts/base/ewp-base-$(tr -d '[:space:]' < docs/VERSION).img"
          test "$(sfdisk -J "$IMG" | jq '.partitiontable.partitions | length')" = "2"
          OFFSET=$(( $(sfdisk -J "$IMG" | jq '.partitiontable.partitions[1].start') * 512 ))
          sudo mkdir -p /mnt/ewp-root
          sudo mount -o loop,ro,offset="$OFFSET" "$IMG" /mnt/ewp-root
          trap 'sudo umount /mnt/ewp-root' EXIT
          grep -Eq '^LABEL=ZIMDATA /var/lib/pi-kiwix-zimdata exfat uid=[0-9]+,gid=[0-9]+,umask=022,nofail' /mnt/ewp-root/etc/fstab
          ! grep -q 'LABEL=zimdata' /mnt/ewp-root/etc/fstab
          ! ls /mnt/ewp-root/etc/ssh/ssh_host_* 2>/dev/null
          test ! -s /mnt/ewp-root/etc/machine-id
          test ! -e /mnt/ewp-root/etc/NetworkManager/system-connections/pi-kiwix-ap.nmconnection
          test ! -e /mnt/ewp-root/opt/emergency-web-pi/config/appliance.local.json
          grep -q '^AP_PASSPHRASE=ChangeThisPassphrase123' /mnt/ewp-root/opt/emergency-web-pi/.env
          test -L /mnt/ewp-root/etc/systemd/system/multi-user.target.wants/pi-kiwix-device-config.service
          test -L /mnt/ewp-root/etc/systemd/system/multi-user.target.wants/pi-kiwix-initial-sync.service
          test ! -e /mnt/ewp-root/etc/systemd/system/multi-user.target.wants/ssh.service
          test -x /mnt/ewp-root/opt/emergency-web-pi/scripts/device_config.py
          ! grep -q '__REPO_DIR__' /mnt/ewp-root/etc/systemd/system/pi-kiwix-device-config.service

      - name: Package assets
        run: |
          bash scripts/package-base-image.sh \
            --version "$(tr -d '[:space:]' < docs/VERSION)" \
            --image "artifacts/base/ewp-base-$(tr -d '[:space:]' < docs/VERSION).img" \
            --manifest "artifacts/base/ewp-base-$(tr -d '[:space:]' < docs/VERSION).img.manifest.json" \
            --out-dir artifacts/base-assets
          # Every asset must stay below GitHub's 2 GiB per-file limit.
          find artifacts/base-assets -type f -size +2000M -print -exec false {} +

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewp-base-image
          path: artifacts/base-assets/*
          retention-days: 14

      # Tag pushes only build and keep the artifact: release.yml owns tag releases and
      # verifies an exact asset list, so uploading here would race with it.
      - name: Upload to existing release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.publish_tag }}" artifacts/base-assets/* --clobber --repo "${{ github.repository }}"
