name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag/version alignment
        id: verify
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content docs/VERSION -Raw).Trim()
          $expectedTag = "v$version"

          if ($tag -ne $expectedTag) {
            throw "Tag $tag does not match VERSION file ($expectedTag)."
          }

          $match = Select-String -Path docs/CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]"
          if (-not $match) {
            throw "Missing changelog section for $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.verify.outputs.version }}"
          $lines = Get-Content docs/CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) {
            throw "Could not find changelog section start for $version"
          }

          $next = ($lines | Select-String -Pattern "^## \[" | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1)
          if ($next) {
            $section = $lines[($start)..($next.LineNumber - 2)]
          } else {
            $section = $lines[($start)..($lines.Count - 1)]
          }

          Set-Content -Path release_notes.md -Value $section -Encoding utf8

      - name: Build portable release bundle
        shell: pwsh
        run: |
          ./scripts/package-portable.ps1 -Version "${{ steps.verify.outputs.version }}"

      - name: Smoke test portable frontend
        shell: pwsh
        run: |
          $bundle = "artifacts/release/EmergencyWebPi-${{ steps.verify.outputs.version }}-windows"
          $required = @("EmergencyWebPi.exe", "Launch-EmergencyWebPi.cmd", "portable/EmergencyWebPi.ps1")
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $bundle $path))) { throw "Missing release entry-point file: $path" }
          }
          ./scripts/smoke-portable.ps1 -BundleDir $bundle

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --notes-file release_notes.md `
            --draft

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -Path artifacts/release -File -Filter "*.zip"
            Get-ChildItem -Path artifacts/release -File -Filter "*.sha256.txt"
          )

          if ($assets.Count -ne 2) {
            throw "Expected one ZIP and one SHA256 file in artifacts/release; found $($assets.Count)."
          }

          gh release upload "${{ github.ref_name }}" $assets.FullName --clobber --repo "${{ github.repository }}"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --json isDraft,assets | ConvertFrom-Json
          $latest = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json

          if ($release.isDraft -or $latest.tag_name -ne "${{ github.ref_name }}") {
            throw "Release ${{ github.ref_name }} was not published as the latest release."
          }

          $expectedAssets = @(
            "EmergencyWebPi-${{ steps.verify.outputs.version }}-windows.zip",
            "EmergencyWebPi-${{ steps.verify.outputs.version }}-windows.sha256.txt"
          )
          $actualAssets = @($release.assets | ForEach-Object { $_.name })
          if ($actualAssets.Count -ne $expectedAssets.Count -or @($expectedAssets | Where-Object { $_ -notin $actualAssets }).Count -ne 0) {
            throw "Published release assets do not match the expected Windows bundle and checksum."
          }

  base-image:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync parted fdisk e2fsprogs xz-utils unzip qemu-user-static binfmt-support systemd

      - name: Register arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Download and verify pinned Raspberry Pi OS Lite base
        run: |
          URL="$(jq -r .downloadUrl config/base-image.json)"
          SHA="$(jq -r .sha256 config/base-image.json)"
          curl -fL --retry 3 -o base.img.xz "$URL"
          echo "$SHA  base.img.xz" | sha256sum -c -

      - name: Build base image
        run: |
          VERSION="$(tr -d '[:space:]' < docs/VERSION)"
          sudo -v
          bash scripts/build-appliance-image.sh \
            --base-image base.img.xz \
            --base-mode \
            --output "artifacts/base/ewp-base-${VERSION}.img"

      - name: Package assets
        run: |
          VERSION="$(tr -d '[:space:]' < docs/VERSION)"
          bash scripts/package-base-image.sh \
            --version "$VERSION" \
            --image "artifacts/base/ewp-base-${VERSION}.img" \
            --manifest "artifacts/base/ewp-base-${VERSION}.img.manifest.json" \
            --out-dir artifacts/base-assets
          # Every asset must stay below GitHub's 2 GiB per-file limit.
          find artifacts/base-assets -type f -size +2000M -print -exec false {} +

      - name: Attach base image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/base-assets/* --clobber --repo "${{ github.repository }}"