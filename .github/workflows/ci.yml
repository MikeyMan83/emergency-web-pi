name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION format
        run: |
          VERSION="$(tr -d '[:space:]' < docs/VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be semantic version MAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Validate CHANGELOG sections
        run: |
          grep -q '^## \[Unreleased\]' docs/CHANGELOG.md || (echo "Missing [Unreleased] section"; exit 1)
          VERSION="$(tr -d '[:space:]' < docs/VERSION)"
          grep -q "^## \[$VERSION\]" docs/CHANGELOG.md || (echo "Missing release section for VERSION=$VERSION"; exit 1)

      - name: Lint shell scripts
        run: |
          bash -n scripts/sync.sh
          bash -n scripts/bootstrap-pi.sh
          bash -n scripts/install.sh
          bash -n scripts/setup-ap.sh
          bash -n scripts/enable-readonly.sh
          bash -n scripts/build-appliance-image.sh
          bash -n scripts/rebuild-library.sh

      - name: Validate estimator script syntax
        run: |
          python -m py_compile scripts/estimate_space.py

      - name: Run first-boot content regression tests
        run: |
          bash tests/test_sync_initial.sh
          python -m unittest tests/test_status_web.py

      - name: Validate repository invariants
        run: |
          python scripts/validate_repo.py

      - name: Validate README estimate markers
        run: |
          grep -q '<!-- SPACE_ESTIMATE:START -->' README.md || (echo "Missing SPACE_ESTIMATE start marker"; exit 1)
          grep -q '<!-- SPACE_ESTIMATE:END -->' README.md || (echo "Missing SPACE_ESTIMATE end marker"; exit 1)
