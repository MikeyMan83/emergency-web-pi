name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION format
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be semantic version MAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Validate CHANGELOG sections
        run: |
          grep -q '^## \[Unreleased\]' CHANGELOG.md || (echo "Missing [Unreleased] section"; exit 1)
          VERSION="$(tr -d '[:space:]' < VERSION)"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || (echo "Missing release section for VERSION=$VERSION"; exit 1)

      - name: Lint shell scripts
        run: |
          bash -n scripts/sync.sh
          bash -n scripts/bootstrap-pi.sh
